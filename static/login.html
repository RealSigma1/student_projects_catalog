<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<main class="meridian-auth-shell">
    <section class="meridian-auth-card">
        <div class="meridian-section-label">StudCollab</div>
        <h1 class="meridian-auth-title">Вход в рабочее пространство</h1>
        <p class="meridian-auth-text">
            Открой каталог инициатив, просмотри роли в командах и управляй своими откликами из одного аккуратного интерфейса.
        </p>

        <form id="loginForm" class="meridian-auth-form">
            <div class="meridian-field-group">
                <label class="meridian-field-label" for="login">Логин или email</label>
                <input class="meridian-field-input" id="login" type="text" required placeholder="student27 or you@example.com">
            </div>
            <div class="meridian-field-group">
                <label class="meridian-field-label" for="password">Пароль</label>
                <input class="meridian-field-input" id="password" type="password" required placeholder="Минимум 8 символов">
            </div>
            <div class="meridian-auth-actions">
                <button class="meridian-btn meridian-btn-solid meridian-btn-lg" type="submit">Войти</button>
                <a class="meridian-btn meridian-btn-ghost meridian-btn-lg" href="/register">Создать аккаунт</a>
            </div>
        </form>

        <div class="message" id="errorBox"></div>
    </section>
</main>

<script src="/static/auth.js"></script>
<script>
    const API = window.location.origin;

    document.getElementById("loginForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const errorBox = document.getElementById("errorBox");
        errorBox.textContent = "";
        errorBox.className = "message";

        const payload = {
            login: document.getElementById("login").value.trim(),
            password: document.getElementById("password").value
        };

        try {
            const response = await fetch(`${API}/api/auth/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
                errorBox.textContent = data.detail || "Не удалось войти.";
                errorBox.classList.add("message-error");
                return;
            }

            if (window.setAccessToken && data.access_token) {
                window.setAccessToken(data.access_token);
            }
            window.location.href = "/";
        } catch (error) {
            errorBox.textContent = "Сетевая ошибка. Попробуй ещё раз.";
            errorBox.classList.add("message-error");
        }
    });
</script>
</body>
</html>
