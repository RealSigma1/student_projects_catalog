<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<main class="auth-shell">
    <section class="auth-card fade-up">
        <div class="eyebrow">Student Projects</div>
        <h1 class="auth-title">Вход</h1>
        <p class="hero-text">
            Открой каталог инициатив, просмотри роли в командах и управляй своими откликами
            из одного аккуратного интерфейса.
        </p>

        <form id="loginForm" style="margin-top: 24px;">
            <div class="field">
                <label for="login">Логин или email</label>
                <input class="control" id="login" type="text" required placeholder="student42 или you@example.com">
            </div>
            <div class="field">
                <label for="password">Пароль</label>
                <input class="control" id="password" type="password" required placeholder="Минимум 8 символов">
            </div>
            <div class="button-row" style="margin-top: 18px;">
                <button class="button button-primary" type="submit">Войти</button>
                <a class="button-link" href="/register">Создать аккаунт</a>
            </div>
        </form>

        <div class="message" id="errorBox"></div>
        <p class="auth-footer">Поддерживается вход и по username, и по email.</p>
    </section>
</main>

<script>
    const API = window.location.origin;

    document.getElementById("loginForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const errorBox = document.getElementById("errorBox");
        errorBox.textContent = "";
        errorBox.className = "message";

        const payload = {
            login: document.getElementById("login").value.trim(),
            password: document.getElementById("password").value
        };

        try {
            const response = await fetch(`${API}/api/auth/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
                errorBox.textContent = data.detail || "Не удалось войти.";
                errorBox.classList.add("message-error");
                return;
            }

            window.location.href = "/";
        } catch (error) {
            errorBox.textContent = "Сетевая ошибка. Попробуй ещё раз.";
            errorBox.classList.add("message-error");
        }
    });
</script>
</body>
</html>
