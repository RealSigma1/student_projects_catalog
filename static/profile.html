<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>🎓 Профиль</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            background: url('https://flatonika.ru/wp-content/uploads/2014/09/Krasivie-foni-dlya-sayta-Background-01-e1409774556464.jpg') no-repeat center center fixed;
            background-size: cover;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.85);
            z-index: -1;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .profile-header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #007BFF;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            font-weight: bold;
            margin: 0 auto 15px;
        }
        .profile-name {
            font-size: 2em;
            margin: 10px 0;
            color: #333;
        }
        .profile-meta {
            color: #666;
            font-size: 1.1em;
        }
        .you-badge {
            background: #28a745;
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.9em;
            margin-left: 10px;
        }
        .projects-list {
            display: grid;
            gap: 20px;
        }
        .project-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .project-card h3 {
            margin-top: 0;
            color: #333;
        }
        .project-card p {
            color: #555;
        }
        .tag {
            display: inline-block;
            background: #e0e0e0;
            padding: 4px 10px;
            margin: 4px;
            border-radius: 20px;
            font-size: 0.85em;
        }
        a {
            color: #007BFF;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #007BFF;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Назад к каталогу</a>

        <div class="profile-header">
            <div class="avatar" id="avatar">?</div>
            <div class="profile-name" id="profileName">Загрузка...</div>
            <div class="profile-meta">
                Проектов: <span id="projectCount">0</span>
                <span id="youBadge" style="display:none;" class="you-badge">Это вы</span>
            </div>
        </div>

        <div class="projects-list" id="projectsList">
            <!-- Сюда подгружаем проекты -->
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";
        const pathParts = window.location.pathname.split('/');
        const username = pathParts[pathParts.length - 1]; // последняя часть URL

        async function loadProfile() {
            try {
                // Определяем, чей профиль запрошен
                const isMyProfile = username === 'me';
                const profileUrl = isMyProfile 
                    ? `${API_URL}/api/profile/me`
                    : `${API_URL}/api/profile/${username}`;

                const profileRes = await fetch(profileUrl);
                if (!profileRes.ok) {
                    document.querySelector('.container').innerHTML = 
                        `<p style="text-align:center; margin-top:50px;">Пользователь не найден.</p>`;
                    return;
                }

                const profile = await profileRes.json();

                // Заполняем данные
                document.getElementById('profileName').textContent = profile.username;
                document.getElementById('projectCount').textContent = profile.project_count;
                document.getElementById('avatar').textContent = profile.username.charAt(0).toUpperCase();

                // Проверяем, это текущий пользователь?
                if (isMyProfile) {
                    document.getElementById('youBadge').style.display = 'inline';
                } else {
                    const meRes = await fetch(`${API_URL}/me`);
                    if (meRes.ok) {
                        const me = await meRes.json();
                        if (me.username === profile.username) {
                            document.getElementById('youBadge').style.display = 'inline';
                        }
                    }
                }

                // Отображаем проекты
                const projectsList = document.getElementById('projectsList');
                if (profile.projects.length === 0) {
                    projectsList.innerHTML = '<p>Пока нет проектов.</p>';
                } else {
                    projectsList.innerHTML = profile.projects.map(p => `
                        <div class="project-card">
                            <h3>${p.title}</h3>
                            <p>${p.description}</p>
                            <div>
                                ${p.tags.map(tag => `<span class="tag">${tag}</span>`).join("")}
                            </div>
                            <div>
                                <a href="${p.github_url}" target="_blank">GitHub</a>
                                ${p.demo_url ? ` | <a href="${p.demo_url}" target="_blank">Демо</a>` : ""}
                            </div>
                        </div>
                    `).join('');
                }

            } catch (e) {
                console.error("Ошибка загрузки профиля", e);
                document.querySelector('.container').innerHTML = 
                    `<p style="text-align:center; margin-top:50px;">Ошибка загрузки профиля.</p>`;
            }
        }

        window.onload = loadProfile;
    </script>
</body>
</html>
