<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<main class="auth-shell">
    <section class="auth-card fade-up">
        <div class="eyebrow">New Profile</div>
        <h1 class="auth-title">Создай профиль для командной работы</h1>
        <p class="hero-text register-hero-text">
            После регистрации ты сможешь публиковать проекты, указывать нужные роли,
            откликаться на инициативы и заполнять профессиональный профиль.
        </p>

        <form id="registerForm" style="margin-top: 24px;">
            <div class="field">
                <label for="username">Username</label>
                <input class="control" id="username" type="text" required placeholder="student42">
                <div class="helper">Латиница, цифры, точка, дефис или подчёркивание.</div>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input class="control" id="email" type="email" required placeholder="you@example.com">
            </div>
            <div class="field">
                <label for="fullName">Имя</label>
                <input class="control" id="fullName" type="text" placeholder="Инал Шидаков">
            </div>
            <div class="field">
                <label for="password">Пароль</label>
                <input class="control" id="password" type="password" required placeholder="Минимум 8 символов">
                <div class="helper"></div>
            </div>
            <div class="button-row auth-actions" style="margin-top: 18px;">
                <button class="button button-secondary" type="submit">Зарегистрироваться</button>
                <a class="button-link" href="/login">У меня уже есть аккаунт</a>
            </div>
        </form>

        <div class="message" id="errorBox"></div>
    </section>
</main>

<script>
    const API = window.location.origin;

    document.getElementById("registerForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const errorBox = document.getElementById("errorBox");
        errorBox.textContent = "";
        errorBox.className = "message";

        const payload = {
            username: document.getElementById("username").value.trim(),
            email: document.getElementById("email").value.trim(),
            full_name: document.getElementById("fullName").value.trim(),
            password: document.getElementById("password").value
        };

        try {
            const response = await fetch(`${API}/api/auth/register`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                errorBox.textContent = data.detail || "Не удалось зарегистрироваться.";
                errorBox.classList.add("message-error");
                return;
            }

            window.location.href = "/login";
        } catch (error) {
            errorBox.textContent = "Сетевая ошибка. Попробуй ещё раз.";
            errorBox.classList.add("message-error");
        }
    });
</script>
</body>
</html>
