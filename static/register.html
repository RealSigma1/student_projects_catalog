<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<main class="meridian-auth-shell">
    <section class="meridian-auth-card">
        <div class="meridian-section-label">Новый профиль</div>
        <h1 class="meridian-auth-title">Новый профиль для проектной работы</h1>
        <p class="meridian-auth-text">
            После регистрации ты сможешь публиковать проекты, указывать нужные роли, откликаться на инициативы и заполнять профессиональный профиль.
        </p>

        <form id="registerForm" class="meridian-auth-form">
            <div class="meridian-field-group">
                <label class="meridian-field-label" for="username">Username</label>
                <input class="meridian-field-input" id="username" type="text" required placeholder="student42">
                <div class="meridian-input-hint">Латиница, цифры, точка, дефис или подчёркивание.</div>
            </div>
            <div class="meridian-field-group">
                <label class="meridian-field-label" for="email">Email</label>
                <input class="meridian-field-input" id="email" type="email" required placeholder="you@example.com">
            </div>
            <div class="meridian-field-group">
                <label class="meridian-field-label" for="fullName">Имя</label>
                <input class="meridian-field-input" id="fullName" type="text" placeholder="Инал Шидаков">
            </div>
            <div class="meridian-field-group">
                <label class="meridian-field-label" for="password">Пароль</label>
                <input class="meridian-field-input" id="password" type="password" required placeholder="Минимум 8 символов">
            </div>
            <div class="meridian-auth-actions">
                <button class="meridian-btn meridian-btn-solid meridian-btn-lg" type="submit">Зарегистрироваться</button>
                <a class="meridian-btn meridian-btn-ghost meridian-btn-lg" href="/login">У меня уже есть аккаунт</a>
            </div>
        </form>

        <div class="message" id="errorBox"></div>
    </section>
</main>

<script>
    const API = window.location.origin;

    document.getElementById("registerForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const errorBox = document.getElementById("errorBox");
        errorBox.textContent = "";
        errorBox.className = "message";

        const payload = {
            username: document.getElementById("username").value.trim(),
            email: document.getElementById("email").value.trim(),
            full_name: document.getElementById("fullName").value.trim(),
            password: document.getElementById("password").value
        };

        try {
            const response = await fetch(`${API}/api/auth/register`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                errorBox.textContent = data.detail || "Не удалось зарегистрироваться.";
                errorBox.classList.add("message-error");
                return;
            }

            window.location.href = "/login";
        } catch (error) {
            errorBox.textContent = "Сетевая ошибка. Попробуй ещё раз.";
            errorBox.classList.add("message-error");
        }
    });
</script>
</body>
</html>
