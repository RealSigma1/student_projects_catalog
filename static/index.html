<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>🎓 Каталог студенческих проектов</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            line-height: 1.6;
            background: url('https://flatonika.ru/wp-content/uploads/2014/09/Krasivie-foni-dlya-sayta-Background-01-e1409774556464.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.85);
            z-index: -1;
        }

        h1 {
            text-align: center;
            margin: 20px 0;
            font-size: 2.5em;
            color: #4a4a4a;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
        }

        #userProfile {
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.2em;
            color: #2c3e50;
            font-weight: bold;
        }

        a {
            color: #007BFF;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        form {
            max-width: 600px;
            margin: 20px auto;
            padding: 25px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        form h3 {
            margin-bottom: 15px;
            font-size: 1.5em;
            color: #333;
        }

        input, textarea, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        input:focus, textarea:focus {
            border-color: #007BFF;
            outline: none;
        }

        button {
            background: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #0056b3;
        }

        .search-section {
            text-align: center;
            margin: 20px 0;
        }

        .search-section input {
            width: 60%;
            display: inline-block;
        }

        .search-section button {
            margin-left: 10px;
            padding: 10px 15px;
        }

        #projectsList {
            max-width: 800px;
            margin: 0 auto;
        }

        .project-card {
            background: #ffffff;
            padding: 20px;
            margin: 15px 0;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .project-card h3 {
            margin-top: 0;
            font-size: 1.3em;
            color: #333;
        }

        .project-card p {
            margin: 10px 0;
            color: #555;
        }

        .tag {
            display: inline-block;
            background: #e0e0e0;
            padding: 5px 10px;
            margin: 5px;
            border-radius: 20px;
            font-size: 0.9em;
            color: #333;
        }

        .project-card a {
            color: #007BFF;
            font-weight: bold;
        }

        .project-card a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>🎓 Каталог студенческих проектов</h1>

    <div id="userProfile">Загрузка профиля...</div>

    <p style="text-align: center;">Добро пожаловать! <a href="/logout">Выйти</a>.</p>

    <!-- Форма добавления проекта -->
    <form id="addProjectForm">
        <h3>Добавить проект</h3>
        <input type="text" id="title" placeholder="Название проекта" required><br>
        <textarea id="description" placeholder="Описание" rows="3" required></textarea><br>
        <input type="text" id="tags" placeholder="Теги (через запятую: Python, ML, Telegram)" required><br>
        <input type="url" id="github_url" placeholder="GitHub URL" required><br>
        <input type="url" id="demo_url" placeholder="Демо (опционально)"><br>
        <button type="submit">Добавить проект</button>
    </form>

    <!-- Поиск по тегам -->
    <div class="search-section">
        <input type="text" id="searchTags" placeholder="Введите теги (через запятую)">
        <button onclick="searchProjects()">Искать</button>
        <button onclick="loadAllProjects()">Показать все</button>
    </div>

    <!-- Результаты -->
    <div id="projectsList"></div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        async function loadUserProfile() {
            try {
                const response = await fetch(`${API_URL}/me`);
                if (response.ok) {
                    const user = await response.json();
                    document.getElementById("userProfile").innerHTML = `
                        👤 Вы вошли как: <strong><a href="/profile/me">${user.username}</a></strong>
                    `;
                } else {
                    document.getElementById("userProfile").innerHTML = "❌ Не авторизован";
                }
            } catch (e) {
                console.error("Ошибка загрузки профиля", e);
                document.getElementById("userProfile").innerHTML = "⚠️ Ошибка загрузки";
            }
        }

        document.getElementById("addProjectForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const title = document.getElementById("title").value;
            const description = document.getElementById("description").value;
            const tags = document.getElementById("tags").value.split(",").map(t => t.trim());
            const github_url = document.getElementById("github_url").value;
            const demo_url = document.getElementById("demo_url").value;

            const response = await fetch(`${API_URL}/projects/`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title, description, tags, github_url, demo_url })
            });

            if (response.ok) {
                alert("Проект успешно добавлен!");
                document.getElementById("addProjectForm").reset();
                loadAllProjects();
            } else {
                const err = await response.json().catch(() => ({}));
                alert("Ошибка: " + (err.detail || "Неизвестная ошибка"));
            }
        });

        async function loadAllProjects() {
            const response = await fetch(`${API_URL}/projects/all`);
            const projects = await response.json();
            renderProjects(projects);
        }

        async function searchProjects() {
            const tagInput = document.getElementById("searchTags").value;
            if (!tagInput) return loadAllProjects();

            const tags = tagInput.split(",").map(t => t.trim());
            const url = new URL(`${API_URL}/projects/`);
            tags.forEach(tag => url.searchParams.append("tags", tag));

            const response = await fetch(url);
            const projects = await response.json();
            renderProjects(projects);
        }

        function renderProjects(projects) {
            const container = document.getElementById("projectsList");
            container.innerHTML = "";

            if (projects.length === 0) {
                container.innerHTML = "<p style='text-align: center;'>Нет проектов.</p>";
                return;
            }

            projects.forEach(p => {
                const card = document.createElement("div");
                card.className = "project-card";
                card.innerHTML = `
                    <h3>${p.title}</h3>
                    <p>${p.description}</p>
                    <div>
                        ${p.tags.map(tag => `<span class="tag">${tag}</span>`).join("")}
                    </div>
                    <div>
                        <a href="${p.github_url}" target="_blank">GitHub</a>
                        ${p.demo_url ? ` | <a href="${p.demo_url}" target="_blank">Демо</a>` : ""}
                    </div>
                    <div style="margin-top: 10px; font-size: 0.95em; color: #555;">
                        Автор: <strong><a href="/profile/${p.owner_username}">${p.owner_username}</a></strong>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.onload = () => {
            loadUserProfile();
            loadAllProjects();
        };
    </script>
</body>
</html>
